name: SOLN Foundation Ingestion

on:
  push:
    branches:
      - main
    paths:
      - "foundation/source/Script (3).pdf"
      - "scripts/ingest-foundation.py"
      - "scripts/classify-foundation.py"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  ingest-foundation:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Verify foundation PDF
        run: |
          test -f foundation/source/Script (3).pdf
          pdfinfo foundation/source/Script (3).pdf

      - name: Read complete foundation
        run: |
          python scripts/ingest-foundation.py

      - name: Classify foundation work
        run: |
          python scripts/classify-foundation.py

      - name: Display manifest
        run: |
          cat foundation/manifests/foundation-tabs.json
          cat foundation/manifests/foundation-work.json

      - name: Upload ingestion evidence
        uses: actions/upload-artifact@v4
        with:
          name: soln-foundation-ingestion
          path: |
            foundation/extracted/
            foundation/manifests/
