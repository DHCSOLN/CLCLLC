name: "Sovereign OS Ingestion Launch"

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy-production:
    name: "AWS Enterprise Provisioning"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform Engine"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: "Zero-Trust Login to AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: ://amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:sso:::instance/ssoins-7223df8cd69e6f84

      - name: "Validate Architecture Layout"
        run: |
          terraform init
          terraform validate

      - name: "Package LND Logic Ingestion Code"
        run: |
          mkdir -p temp
          zip -r temp/placeholder_lambda_payload.zip index.js

      - name: "Execute Main Infrastructure Build"
        run: terraform apply -auto-approve
