name: CLCLLC Build
on:
  push:
    branches:
    - main
    - release/*
on:
  pull_request:
    branches:
    - main
permissions:
  contents: read
on:
  schedule:
  - cron: "0 2 * * 1-5"
jobs:
  build:
    runs-on: ubuntu-latest
jobs:
  my_job:
    name: deploy to staging
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify environment
        run: |
          echo "=== CLCLLC BUILD ENVIRONMENT ==="
          node --version
          java -version
          mvn --version
      - name: Install Dependencies
        run: npm install
  
      - name: Compile
        run: mvn --batch-mode clean compile

      - name: Test
        run: mvn --batch-mode test

      - name: Verify
        run: mvn --batch-mode verify

      - name: CLCLLC build complete
        run: echo "CLCLLC BUILD PASSED"
